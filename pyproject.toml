[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyawskit"
version = "0.1.87"
requires-python = ">=3.14"
authors = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
maintainers = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
description = "Pyawskit is your AWS Swiss Army Knife"
readme = "README.md"
license = "MIT"
keywords=[
    "aws",
    "utils",
    "python",
    "api",
    "command",
    "line",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pylogconf",
    "pyfakeuse",
    "pypipegzip",
    "tqdm",
    "requests",
    "boto3",
    "pymount",
    "ujson",
    "sultan",
    "pytconf",
    "pyapikey",
    "furl",
    "docker-py",
    "botocore",
]

[project.urls]
"Homepage" = "https://github.com/veltzer/pyawskit"
"Bug Tracker" = "https://github.com/veltzer/pyawskit/issues"
"Documentation" = "https://veltzer.github.io/pyawskit"
"Download" = "https://pypi.org/project/pyawskit/"
"Repository" = "https://github.com/veltzer/pyawskit"

[project.scripts]
pyawskit = "pyawskit.main:main"

[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyawskit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pyawskit/",
    "README.md",
    "LICENSE",
    "pyproject.toml"
]
exclude = [
    ".gitignore",
    ".github/",
    "tests/",
    "docs/",
    "config/",
    "*.md",
]

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor). preset = "legacy" is
# pyrefly's mypy-compatible behavior; "." on the search path is mypy's
# implicit current directory.
preset = "legacy"
python-version = "3.14"
search-path = [
    "src",
    ".",
]
# Third-party libraries without type information.
ignore-missing-imports = [
    "boto3.*",
    "botocore.*",
    "furl.*",
    "pyapikey.*",
    "pylogconf.*",
    "pymount.*",
    "pypipegzip.*",
    "pytconf.*",
    "sultan.*",
    "tqdm.*",
]

[tool.pyrefly.errors]
no-any-return = "error"

[tool.hatch.envs.default]
installer = "uv"

[tool.uv.pip]
prerelease = "disallow"

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "sphinx",
    "types-requests",
    "types-tqdm",
]
